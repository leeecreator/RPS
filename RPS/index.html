<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
 <body style="margin: 0; padding: 0; box-sizing: border-box">
    <section
      style="
        display: flex;
        flex-direction: column;
        /* justify-content: center; */
        background-color: cornflowerblue;
        border: 1px solid red;
        height: 100vh;
        align-items: center;
        padding: 24px;
      "
    >
      <h1
        style="
          width: 450px;
          padding: 12px;
          border-radius: 24px;
          font-family: Arial, Helvetica, sans-serif;
          font-weight: 700;
          background-color: red;
          color: white;
          text-align: center;
        "
      >
        ROCK PAPER SCISSORS
      </h1>
      <div style="display: flex; gap: 60px">
        <div
          style="
            display: flex;
            flex-direction: column;
            /* border: 1px solid red; */
            align-items: center;
            /* border: 1px solid red; */
          "
        >
          <h3
            style="
              font-family: Arial, Helvetica, sans-serif;
              color: white;
              /* border: 1px solid red; */
            "
          >
            HUMANS
          </h3>
          <img
            id="humanimg"
            style="
              width: 200px;
              height: 200px;
              border-radius: 100%;

              object-fit: cover;
            "
            src="./images/Words.jpg"
          />
        </div>
        <div
          style="
            display: flex;
            flex-direction: column;
            /* border: 1px solid red; */
            align-items: center;
            /* border: 1px solid red; */
          "
        >
          <h3 style="font-family: Arial, Helvetica, sans-serif; color: white">
            COMPUTER
          </h3>
          <img
            id="computerimg"
            style="
              width: 200px;
              height: 200px;
              border-radius: 100%;
              object-fit: cover;
            "
            src="./images/Words.jpg"
          />
        </div>
      </div>

      <div style="margin-top: 60px">
        <img
          onclick="play('rock')"
          style="
            width: 100px;
            height: 100px;
            border-radius: 100%;
            object-fit: cover;
          "
          src="./images/download.jpg"
        />
        <img
          onclick="play('paper')"
          style="
            width: 100px;
            height: 100px;
            border-radius: 100%;
            object-fit: cover;
          "
          src="./images/download (10).jpg"
        />
        <img
          onclick="play('scissors')"
          style="
            width: 100px;
            height: 100px;
            border-radius: 100%;
            object-fit: cover;
          "
          src="./images/download (1).jpg"
        />
      </div>

      <h1
        id="results"
        style="
          padding: 12px;
          text-align: center;
          width: 200px;
          border-radius: 16px;
          background-color: gold;
          color: white;
          font-family: Arial, Helvetica, sans-serif;
        "
      >
        RESULT
      </h1>
    </section>
    <script>
      function play(humanChoice) {
        let choices = ["rock", "paper", "scissors"];

        let computerChoice = choices[Math.floor(Math.random() * 3)];

        let images = {
          rock: "./images/download.jpg",
          paper: "./images/download (10).jpg",
          scissors: "./images/download (1).jpg",
        };

        document.getElementById("humanimg").src = images[humanChoice];

        document.getElementById("computerimg").src = images[computerChoice];

        if (humanChoice === computerChoice) {
          document.getElementById("results").innerHTML = "DRAW!";
        } else if (
          (humanChoice === "rock" && computerChoice === "scissors") ||
          (humanChoice === "paper" && computerChoice === "rock") ||
          (humanChoice === "scissors" && computerChoice === "paper")
        ) {
          document.getElementById("results").innerHTML = "YOU WIN!";
        } else {
          document.getElementById("results").innerHTML = "COMPUTER WINS!";
        }
      }
      console.log(play);
    </script>




  </body>
</html>
